    <!-- GA4_BOOTSTRAP_START -->
    <script>
      // GA4, loaded conditionally: skipped entirely when VITE_GA_MEASUREMENT_ID isn't set
      // (e.g. local dev without a .env), and skipped during the local prerender crawl
      // (scripts/prerender.ts appends ?_prerender=1) so refreshing static snapshots never
      // sends real pageviews for bot/crawl traffic. send_page_view is off because this is a
      // client-routed SPA — src/lib/usePageMeta.ts fires page_view manually on every route
      // change instead, since GA4's own history-based auto-tracking can't guarantee the
      // page title is already updated by the time it fires.
      (function () {
        var measurementId = '%VITE_GA_MEASUREMENT_ID%';
        // Vite leaves the literal %VAR_NAME% placeholder in place (doesn't blank it out)
        // when the env var isn't set — e.g. no .env.local yet, or not configured on Vercel.
        var isConfigured = measurementId && measurementId.charAt(0) !== '%';
        var isPrerenderCrawl = new URLSearchParams(location.search).has('_prerender');
        if (!isConfigured || isPrerenderCrawl) return;

        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + measurementId;
        document.head.appendChild(s);

        window.dataLayer = window.dataLayer || [];
        window.gtag = function () {
          window.dataLayer.push(arguments);
        };
        gtag('js', new Date());
        gtag('config', measurementId, { send_page_view: false });
      })();
    </script>
    <!-- GA4_BOOTSTRAP_END -->
  </head>
  <body>
