<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>WP CodeKit — WordPress code generators</title>
    <meta
      name="description"
      content="Fill in a form, get production-ready WordPress PHP. Post types, taxonomies, queries, hooks, readme.txt and more. Live previews, no signup."
    />
    <link rel="canonical" href="https://www.wpcodekit.com/" />
    <!--
      Let Google use as much of the page as it wants in snippets and AI
      Overviews. The default cap truncates the answer paragraphs, which is
      exactly the text we want quoted. usePageMeta replaces this whole tag with
      `noindex` on the routes that need it.
    -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:image:alt" content="WP CodeKit — free WordPress code generators" />
    <meta property="og:site_name" content="WP CodeKit" />
    <meta property="og:title" content="WP CodeKit — WordPress code generators" />
    <meta
      property="og:description"
      content="Fill in a form, get production-ready WordPress PHP. Post types, taxonomies, queries, hooks, readme.txt and more. Live previews, no signup."
    />
    <meta property="og:url" content="https://www.wpcodekit.com/" />
    <meta property="og:image" content="https://www.wpcodekit.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WP CodeKit — WordPress code generators" />
    <meta
      name="twitter:description"
      content="Fill in a form, get production-ready WordPress PHP. Post types, taxonomies, queries, hooks, readme.txt and more. Live previews, no signup."
    />
    <meta name="twitter:image" content="https://www.wpcodekit.com/og-image.png" />

    <!--
      Sitewide entities only. The WebApplication block that used to live here was
      emitted on all 59 URLs while declaring "url": the homepage — so every tool
      page asserted it was the homepage app. Per-tool WebApplication is now
      injected by GeneratorRoute with its own @id, and the site-level identity is
      expressed as Organization + WebSite, which is what actually belongs on
      every page.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://www.wpcodekit.com/#organization",
        "name": "WP CodeKit",
        "url": "https://www.wpcodekit.com/",
        "logo": {
          "@type": "ImageObject",
          "url": "https://www.wpcodekit.com/logo.png",
          "width": 512,
          "height": 512
        },
        "description": "WP CodeKit builds free, browser-based generators that turn a form into production-ready WordPress code.",
        "parentOrganization": {
          "@type": "Organization",
          "name": "GrowQuest",
          "url": "https://growquest.io"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://www.wpcodekit.com/#website",
        "name": "WP CodeKit",
        "url": "https://www.wpcodekit.com/",
        "publisher": { "@id": "https://www.wpcodekit.com/#organization" },
        "inLanguage": "en",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://www.wpcodekit.com/tools?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- GA4_BOOTSTRAP_START -->
    <script>
      // GA4, loaded conditionally: skipped entirely when VITE_GA_MEASUREMENT_ID isn't set
      // (e.g. local dev without a .env), and skipped during the local prerender crawl
      // (scripts/prerender.ts appends ?_prerender=1) so refreshing static snapshots never
      // sends real pageviews for bot/crawl traffic. send_page_view is off because this is a
      // client-routed SPA — src/lib/usePageMeta.ts fires page_view manually on every route
      // change instead, since GA4's own history-based auto-tracking can't guarantee the
      // page title is already updated by the time it fires.
      (function () {
        var measurementId = '%VITE_GA_MEASUREMENT_ID%';
        // Vite leaves the literal %VAR_NAME% placeholder in place (doesn't blank it out)
        // when the env var isn't set — e.g. no .env.local yet, or not configured on Vercel.
        var isConfigured = measurementId && measurementId.charAt(0) !== '%';
        var isPrerenderCrawl = new URLSearchParams(location.search).has('_prerender');
        if (!isConfigured || isPrerenderCrawl) return;

        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + measurementId;
        document.head.appendChild(s);

        window.dataLayer = window.dataLayer || [];
        window.gtag = function () {
          window.dataLayer.push(arguments);
        };
        gtag('js', new Date());
        gtag('config', measurementId, { send_page_view: false });
      })();
    </script>
    <!-- GA4_BOOTSTRAP_END -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
